version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: metrorouter
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  otp:
    image: opentripplanner/opentripplanner:2.5.0
    volumes:
      - ../backend/data/otp:/var/opentripplanner
      - otp_cache:/var/opentripplanner/graph
    ports:
      - "8080:8080"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx4g"
    command: >
      --load --serve
      --build /var/opentripplanner
      --port 8080
    mem_limit: 6g

  backend:
    build: ../backend
    environment:
      OTP_URL: http://otp:8080
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://app:secret@postgres/metrorouter
    volumes:
      - ../backend/app:/app/app
    ports:
      - "8000:8000"
    depends_on:
      - otp
      - redis
      - postgres
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  otp_cache: