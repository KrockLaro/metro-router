name: Daily Schedule Sync

on:
  schedule:
    - cron: '0 0 * * 1-6'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metro_router
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt asyncpg

      - name: Run sync script
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/metro_router
          YANDEX_RASP_API_KEY: ${{ secrets.YANDEX_RASP_API_KEY }}
        run: |
          cd backend
          python -m scripts.auto_sync

      - name: Commit and push changes
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add backend/init.sql
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update schedule" && git push)