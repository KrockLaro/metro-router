name: Daily Schedule Sync

on:
  schedule:
    - cron: '0 0 * * 1-6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metro_router
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          # Используем python -m pip, чтобы гарантировать установку в ту же версию Python
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt asyncpg arq redis
          
          # Проверка: если шаг дойдет сюда и arq не установится, будет ошибка
          echo "--- Проверка установки arq ---"
          python -m pip show arq

      # Опциональный шаг, если init.sql еще нет, он не сломает процесс
      - name: Init Database
        continue-on-error: true
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d metro_router -f backend/init.sql

      - name: Run sync script
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/metro_router
          REDIS_URL: redis://localhost:6379
          YANDEX_RASP_API_KEY: ${{ secrets.YANDEX_RASP_API_KEY }}
        run: |
          cd backend
          # Запускаем скрипт именно через python
          python -m scripts.auto_sync

      - name: Commit and push changes
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add backend/init.sql
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update schedule [skip ci]"
            git push
          else
            echo "Нет изменений для коммита"
          fi